name: E2E Tests 

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.2"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'

      - name: Install and build
        run: |
          make install
          source .venv/bin/activate
          make bundle

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: rml-linux-tarball
          path: dist/rml-linux-*.tar.gz

      - name: Upload e2e test file
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-file
          path: tests/e2e/test_e2e.py

      - name: Add binary to PATH
        run: echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


  test-linux-clean:
    name: Test
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact only (no checkout)
        uses: actions/download-artifact@v4
        with:
          name: rml-linux-tarball
          path: artifact

      - name: Download e2e test file
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-file
          path: e2e-test

      - name: Extract binary
        run: |
          mkdir -p dist/extracted
          TAR_FILE=$(ls artifact/rml-linux-*.tar.gz | head -n1)
          echo "Using tarball: $TAR_FILE"
          tar -xzf "$TAR_FILE" -C dist/extracted
          echo "BIN_DIR=dist/extracted/rml" >> $GITHUB_ENV

      - name: Add binary to PATH
        run: echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Smoke test binary in clean shell
        shell: bash -l {0}
        run: |
          set -euxo pipefail
          rml --version
          rml -md --help
      - name: Clone recurse-e2e-test-repo
        uses: actions/checkout@v5
        with:
          repository: Recurse-ML/recurse-e2e-test-repo
          ref: e2e-test-branch

      - name: Run e2e test file
        env:
          BUG_BRANCH: "e2e-test-branch"
        run: pytest -q e2e-test/test_e2e.py


